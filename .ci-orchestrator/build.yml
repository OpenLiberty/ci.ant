type: pipeline_definition
product: Liberty
name: OpenLiberty CI Ant
description: Run a Pipeline for ci.ant using Cognitive Software Delivery infrastructure

triggers:
- type: manual
  triggerName: "Manual"
  description: "Runs a ci.ant Pipeline, building and testing the PR - Manual Trigger"
  triggerRank: 50
  groups: ["WebsphereCommonComponents"]
- type: github
  triggerName: "GitHub"
  description: "Runs a ci.ant Pipeline, building and testing the PR - Github Trigger"
  triggerRank: 50
  groups: ["WebsphereCommonComponents"]
  keyword: "!build"
  aliasKeywords:
    - "#build"

steps:
- stepGroup: Build ci.ant Dependency
  includeSteps:
  - file: steps/buildCiAntDependency.yml
- stepGroup: Build ci.ant
  includeSteps:
  - file: steps/buildCiAnt.yml
